name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot pytest
      - name: Seed config.json
        run: |
          cat > config.json <<'EOF'
          {"token":"x","allowed_ids":[1],"tmux_session":"t","claude_path":"/bin/true"}
          EOF
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Run tests
        run: pytest -v
